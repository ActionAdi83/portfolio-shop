# Local dev overrides — same shape as fanvote's application-development.properties.
#
# Port 8082 and Mongo port 27018 rather than the obvious 8080/27017: this project
# lives on the same machine as `fanvote`, whose own local stack already claims
# those. Run `docker compose up -d mongo` from the repo root first (it publishes
# Mongo on 27018), then `mvn spring-boot:run` for the backend.
server.port=8082

spring.data.mongodb.uri=mongodb://localhost:27018/portfolio_shop
spring.data.mongodb.database=portfolio_shop

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/shop
