spring.application.name=portfolio-shop

server.port=8080

spring.profiles.active=${SPRING_PROFILES_ACTIVE:development}

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/portfolio_shop}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:portfolio_shop}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/shop}

# Product photos, uploaded from the admin screen (see ProductImageController)
# and stored in GridFS. Same limit as fanvote's own picture uploads.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# BTCPay Server. Every secret comes from the environment — nothing here may be
# given a working default, or it ends up committed. Blank values are handled:
# the invoice endpoint answers 503 rather than the app crashing on startup.
btcpay.url=${BTCPAY_URL:}
btcpay.public-url=${BTCPAY_PUBLIC_URL:}
btcpay.store-id=${BTCPAY_STORE_ID:}
btcpay.api-key=${BTCPAY_API_KEY:}
btcpay.webhook-secret=${BTCPAY_WEBHOOK_SECRET:}
btcpay.currency=${BTCPAY_CURRENCY:USD}
btcpay.invoice-expiration-minutes=${BTCPAY_INVOICE_EXPIRATION_MINUTES:60}

management.endpoints.web.exposure.include=health
